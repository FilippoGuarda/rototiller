multi_chomp_server:
  ros__parameters:
    num_robots: 6
    waypoints_per_robot: 100
    dt: 0.1
    eta: 10000.0     # learning rate
    lambda: 0.01     # smoothness 
    mu: 10.0         # Obstacle/Collision weight
    robot_radius: 5.0
    obstacle_max_dist: 4.0

fleet_coordinator:
  ros__parameters:
    robot_count: 6
    controller_id: FollowPath
    max_optimized_segment_length: 0.50
    stretch_factor: 2.0
    replan_cooldown_sec: 2.0
    stuck_timeout_sec: 5.0
    stuck_motion_epsilon: 0.05
    stuck_replan_cooldown_sec: 3.0
