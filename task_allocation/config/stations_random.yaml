task_allocation_node:
  ros__parameters:
    # Robot configuration
    num_robots: 6
    global_frame: "map"
    robot_base_frame_prefix: "robot"
    robot_base_frame_suffix: "/base_link"
    robot_footprint_radius: 0.5

    # Graph and node matching
    node_match_threshold_m: 1.5
    k_nearest_graph_nodes: 3
    station_connection_distance: 3.0

    # Update rate
    update_rate_hz: 1.0
    use_sim_time: true

    # Tropical optimization weights
    alpha_distance: 1.0
    alpha_usage: 0.5
    alpha_battery: 2.0
    task_allocation_batch_size: 3

    # Robot defaults
    robot_defaults:
      battery_soc: 1.0
      max_range_m: 10000.0
      usage_index: 0.0

    # === STATION CONFIGURATION ===
    # Each station type (a, b, c) has multiple instances
    # Task format: "task_id,station_name1|station_name2|station_nameN,priority"
    # Examples:
    # - "task_001,stationa1|stationc2,1.0" (A→C)
    # - "task_002,stationc1|stationb1,2.0" (C→B)
    # - "task_003,stationa1|stationb1|stationc1,1.5" (A→B→C)
    retry_cooldown_sec: 10
    max_allocation_attempts: 5000
    station_types: ["a", "b", "c"]
    stations:
      a:
        names: ["stationa1", "stationa2", "stationa3", "stationa4"]
